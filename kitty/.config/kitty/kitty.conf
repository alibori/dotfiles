# mirrors alacritty.toml
font_family      JetBrainsMono Nerd Font
font_size        11.5
text_composition_strategy legacy
background_opacity 0.65
window_padding_width 12
hide_window_decorations yes
shell /usr/bin/bash --login
term xterm-256color
confirm_os_window_close 0

# block cursor everywhere (no-cursor stops shell integration forcing beam at prompt)
cursor_shape block
shell_integration no-cursor

# shift+enter sends ESC+CR (same as alacritty binding)
map shift+enter send_text all \x1b\r

include ~/.cache/wal/colors-kitty.conf

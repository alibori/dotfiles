backend = "glx";

opacity-rule = [
  "90:class_g = 'kitty'"
];

corner-radius = 10;
shadow = true;
shadow-radius = 12;
shadow-opacity = 0.35;

shadow-color = "#000000";

fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;

# Blur whatever sits behind translucent windows (needs the glx backend)
blur-method = "dual_kawase";
blur-strength = 5;
blur-background-exclude = [
  "window_type = 'desktop'",
  # GTK client-side decorations: their invisible shadow margin would blur as a box
  "_GTK_FRAME_EXTENTS@:c"
];

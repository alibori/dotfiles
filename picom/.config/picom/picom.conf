backend = "glx";

opacity-rule = [
  "90:class_g = 'kitty'"
];

corner-radius = 10;
shadow = true;
shadow-radius = 12;
shadow-opacity = 0.35;

shadow-color = "#000000";
# Polybar is a faint translucent tint: no shadow/rounding/blur on it,
# or the see-through bar renders as a grey smudged box.
shadow-exclude = [ "class_g = 'Polybar'" ];
rounded-corners-exclude = [ "class_g = 'Polybar'" ];

fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;

# Blur whatever sits behind translucent windows (needs the glx backend)
blur-method = "dual_kawase";
blur-strength = 5;
blur-background-exclude = [
  "window_type = 'desktop'",
  # maim -s selection overlay (slop) is a fullscreen translucent window
  "class_g = 'slop'",
  "class_g = 'Polybar'",
  # GTK client-side decorations: their invisible shadow margin would blur as a box
  "_GTK_FRAME_EXTENTS@:c"
];

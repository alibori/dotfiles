;==========================================================
;   pywal template — rendered to ~/.cache/wal/colors-polybar.ini
;
;   Key names are generic (cyan/orange/magenta) so config.ini never has to
;   change when the palette does; the values come from the wallpaper.
;==========================================================

[colors]
; Faint dark tint (alpha 0x40 = 25%) of color0: wallpaper still shows
; through, but light wallpapers no longer wash out the muted palette text.
background     = #40{color0.strip}
background-alt = #cc{color0.strip}

; --- text ---
foreground = {foreground}
dim        = {color8}
white      = {color15}

; --- accents ---
green      = {color2}
cyan       = {color4}
yellow     = {color3}
orange     = {color9}
red        = {color1}
magenta    = {color5}
teal       = {color6}
lavender   = {color12}

; --- surfaces (used sparingly) ---
surface0 = {color0}
surface1 = {color8}

; vim:ft=dosini

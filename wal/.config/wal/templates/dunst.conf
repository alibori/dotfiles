# pywal template — rendered to ~/.cache/wal/dunst.conf and linked into
# ~/.config/dunst/dunstrc.d/ by apply.sh. Only colors; everything else stays
# in dunstrc.

[urgency_low]
    background = "{background}"
    foreground = "{color7}"
    frame_color = "{color8}"
    highlight = "{color8}"

[urgency_normal]
    background = "{background}"
    foreground = "{foreground}"
    frame_color = "{color5}"
    highlight = "{color5}"

[urgency_critical]
    background = "{background}"
    foreground = "{color1}"
    frame_color = "{color1}"
    highlight = "{color1}"

[volume]
    frame_color = "{color4}"
    highlight = "{color4}"

[brightness]
    frame_color = "{color3}"
    highlight = "{color3}"

[battery_low]
    frame_color = "{color9}"
    foreground = "{color9}"

[errors]
    frame_color = "{color1}"
    foreground = "{color1}"


[window]
opacity = 0.75
padding = { x = 12, y = 12 }
decorations = "none"

[font]
size = 11.5

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"

[terminal.shell]
program = "/usr/bin/bash"
args = ["--login"]

[env]
TERM = "xterm-256color"


[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"

[general]
import = [
  "~/.config/alacritty/themes/themes/catppuccin_mocha.toml"
]

[terminal]

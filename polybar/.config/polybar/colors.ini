;==========================================================
;   Catppuccin Mocha — shared by all bars
;
;   Key names are generic (cyan/orange/magenta) so config.ini never has to
;   change when the palette does; the values are Mocha's.
;==========================================================

[colors]
; Fully transparent bar. The alpha byte is 00, so picom composites nothing at
; all and the wallpaper/windows show straight through. Only module text is
; painted.
background     = #00000000
background-alt = #cc181825

; --- text ---
foreground = #cdd6f4
dim        = #6c7086
white      = #cdd6f4

; --- accents ---
green      = #a6e3a1
cyan       = #89b4fa
yellow     = #f9e2af
orange     = #fab387
red        = #f38ba8
magenta    = #cba6f7
teal       = #94e2d5
lavender   = #b4befe

; --- surfaces (used sparingly) ---
surface0 = #313244
surface1 = #45475a

; vim:ft=dosini

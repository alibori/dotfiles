;==========================================================
;
;   ██████╗  ██████╗ ██╗  ██╗   ██╗██████╗  █████╗ ██████╗
;   ██╔══██╗██╔═══██╗██║  ╚██╗ ██╔╝██╔══██╗██╔══██╗
;   ██████╔╝██║   ██║██║   ╚████╔╝ ██████╔╝███████║██████╔╝
;   ██╔═══██║██║    ╚██╔╝  ██╔══██╗██╔══██║██╔══██║
;   ██║     ╚██████╔╝███████╗██║   ██████╔╝██║  ██║██║  ██║
;   ╚═╝      ╚═════╝ ╚══════╝╚═╝   ╚═════╝ ╚═╝  ╚═╝╚═╝  ╚═╝
;
;   pywal palette, fully transparent, flat (no powerline segments).
;   Palette is generated by wal from ~/.config/wal/templates/colors-polybar.ini.
;
;==========================================================

include-file = ~/.cache/wal/colors-polybar.ini

;==========================================================
;   BARS
;==========================================================

[bar/main]
monitor = eDP
width = 100%
height = 26pt
dpi = 120
radius = 0
fixed-center = true

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 2pt
border-size = 0

; Flat layout with no joined segments, so modules need breathing room.
padding-left = 2
padding-right = 2
module-margin = 2
separator =

font-0 = "JetBrainsMono Nerd Font:style=Bold:size=10;2"
font-1 = "JetBrainsMono Nerd Font:size=13;3"
font-2 = "UbuntuMono Nerd Font Mono:size=18;4"
; Fallback for Braille (U+2800) spinners in window titles — the Nerd Fonts
; above don't cover that block.
font-3 = "DejaVu Sans:size=9;2"
; Claude ✳ glyph (claude-usage module uses %{T5}).
font-4 = "DejaVu Sans:size=15;4"

modules-left = xworkspaces xwindow
modules-center = date
modules-right = claude-usage pulseaudio cpu temp wlan wireguard battery powermenu battery-alert

cursor-click = pointer
cursor-scroll = ns-resize
enable-ipc = true

[bar/secondary]
;monitor = HDMI-A-0
width = 100%
height = 20pt
dpi = 120
radius = 0
fixed-center = true

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 1.5pt
border-size = 0

padding-left = 2
padding-right = 2
module-margin = 2
separator =

font-0 = "JetBrainsMono Nerd Font:style=Bold:size=9;2"
font-1 = "JetBrainsMono Nerd Font:size=11;3"
font-2 = "UbuntuMono Nerd Font Mono:size=16;3"
font-3 = "DejaVu Sans:size=8;2"
font-4 = "DejaVu Sans:size=13;3"

modules-left = xworkspaces xwindow
modules-center = date
modules-right = claude-usage pulseaudio cpu temp wireguard battery

cursor-click = pointer
cursor-scroll = ns-resize
enable-ipc = true

;==========================================================
;   MODULES
;
;   Flat style: no module carries a background, so the bar is see-through
;   everywhere except the glyphs themselves. Icons are separate elements
;   (format-prefix or a single-step ramp) so they can take ${colors.x}:
;   polybar only expands a reference when it is the whole value, never
;   inside a %{F...} tag. Click actions wrap the icon in `format`.
;==========================================================

[module/xworkspaces]
type = internal/xworkspaces

; pin-workspaces is deliberately NOT set: every bar lists all desktops from
; all three monitors, not just its own.

; Numbers, not glyphs: sxhkdrc binds super+{1-9} by number, so the label has
; to match what you press. State is carried by color and underline.
label-active = %name%
label-active-foreground = ${colors.green}
label-active-underline = ${colors.green}
label-active-padding = 1

label-occupied = %name%
label-occupied-foreground = ${colors.cyan}
label-occupied-padding = 1

label-urgent = %name%
label-urgent-foreground = ${colors.red}
label-urgent-underline = ${colors.red}
label-urgent-padding = 1

label-empty = %name%
label-empty-foreground = ${colors.dim}
label-empty-padding = 1

format = <label-state>

scroll-up = bspc desktop -f prev.local
scroll-down = bspc desktop -f next.local

[module/xwindow]
type = internal/xwindow
label = " %title:0:40:…%"
label-foreground = ${colors.white}
format = <label>
format-prefix = ""
format-prefix-font = 2
format-prefix-foreground = ${colors.green}

[module/date]
type = internal/date
interval = 1
date = %H:%M
date-alt = "%a %d/%m/%Y  %H:%M:%S"
label = " %date%"
label-foreground = ${colors.green}
format = <label>
format-prefix = "󱑂"
format-prefix-font = 2
format-prefix-foreground = ${colors.cyan}

; click-left is consumed by polybar's built-in date/date-alt toggle.
click-right = alacritty -e calcure

[module/pulseaudio]
type = internal/pulseaudio

format-volume = <ramp-volume> <label-volume>
label-volume = %percentage%%
label-volume-foreground = ${colors.white}

ramp-volume-0 = "󰖁"
ramp-volume-1 = "󰕿"
ramp-volume-2 = "󰖀"
ramp-volume-3 = "󰕾"
ramp-volume-font = 2
ramp-volume-foreground = ${colors.cyan}

format-muted = <label-muted>
label-muted = "%{T2}󰝟%{T-} muted"
label-muted-foreground = ${colors.dim}

click-left = pactl set-sink-mute @DEFAULT_SINK@ toggle
click-right = pavucontrol
scroll-up = pactl set-sink-volume @DEFAULT_SINK@ +5%
scroll-down = pactl set-sink-volume @DEFAULT_SINK@ -5%

[module/cpu]
type = internal/cpu
interval = 2
label = "%percentage%%"
label-foreground = ${colors.cyan}
; Single-step ramp = static icon that can take a ${colors.x} color.
ramp-load-0 = ""
ramp-load-font = 2
ramp-load-foreground = ${colors.cyan}
format = %{A1:~/.config/polybar/scripts/btop-float.sh:}<ramp-load> <label>%{A}

[module/temp]
type = internal/temperature
interval = 5

; hwmon indices shift across reboots, so launch.sh resolves k10temp and exports
; POLYBAR_HWMON_CPU. The literal below is only a fallback for a polybar started
; outside launch.sh — it may be stale.
hwmon-path = ${env:POLYBAR_HWMON_CPU:/sys/devices/pci0000:00/0000:00:18.3/hwmon/hwmon6/temp1_input}
base-temperature = 30
warn-temperature = 80

label = "%temperature-c%"
label-foreground = ${colors.white}
label-warn = "%temperature-c%"
label-warn-foreground = ${colors.red}

ramp-0 = "󰔏"
ramp-1 = "󰔏"
ramp-2 = "󰸁"
ramp-font = 2
ramp-foreground = ${colors.yellow}

format = %{A1:~/.config/polybar/scripts/btop-float.sh:}<ramp> <label>%{A}
format-warn = %{A1:~/.config/polybar/scripts/btop-float.sh:}<ramp> <label-warn>%{A}

[module/wlan]
type = internal/network
interval = 5
interface-type = wireless

; The module-level click-left/click-right keys are silently ignored on
; internal/network in polybar 3.7.1 (they work on custom/script, which is why
; the wireguard widget can use them). Wrapping the labels in explicit action
; tags is the workaround: %{A1:...:} = left click, %{A3:...:} = right click,
; %{A} closes. Commands must not contain an unescaped ':'.
label-connected = "%essid:0:14%"
label-connected-foreground = ${colors.green}
ramp-signal-0 = "󰖩"
ramp-signal-font = 2
ramp-signal-foreground = ${colors.green}

; internal/network has no icon element for the disconnected state, so the
; icon sits in the label and shares its color.
label-disconnected = "%{T2}󰖪%{T-} offline"
label-disconnected-foreground = ${colors.red}

format-connected = "%{A1:~/.config/polybar/scripts/wifi-menu.sh:}%{A3:alacritty -e nmtui:}<ramp-signal> <label-connected>%{A}%{A}"
format-disconnected = "%{A1:~/.config/polybar/scripts/wifi-menu.sh:}%{A3:alacritty -e nmtui:}<label-disconnected>%{A}%{A}"

[module/wireguard]
type = custom/script
exec = ~/.config/polybar/scripts/wg-status.sh
interval = 5
format = <label>

click-left = ~/.config/polybar/scripts/wg-toggle.sh

; Claude Code plan limits for personal + work accounts. Click toggles the rofi
; popup. No font ships the Claude logo; ✳ (8-spoke asterisk, in
; Claude orange) is the closest, drawn with font-4 (DejaVu Sans) — every bar
; using this module must define font-4.
[module/claude-usage]
type = custom/text
format = "%{T5}%{F#d97757}✳%{F-}%{T-}"
click-left = ~/.config/polybar/scripts/claude-usage.sh

[module/battery]
type = internal/battery
battery = BAT0
adapter = AC0
poll-interval = 5

label-charging = " %percentage%%"
label-charging-foreground = ${colors.white}
label-discharging = " %percentage%%"
label-discharging-foreground = ${colors.white}
label-full = " %percentage%%"
label-full-foreground = ${colors.white}
label-low = " %percentage%%"
label-low-foreground = ${colors.red}

ramp-capacity-0 = ""
ramp-capacity-1 = ""
ramp-capacity-2 = ""
ramp-capacity-3 = ""
ramp-capacity-4 = ""
ramp-capacity-font = 2
ramp-capacity-0-foreground = ${colors.red}
ramp-capacity-1-foreground = ${colors.orange}
ramp-capacity-2-foreground = ${colors.yellow}
ramp-capacity-3-foreground = ${colors.green}
ramp-capacity-4-foreground = ${colors.green}

animation-charging-0 = ""
animation-charging-1 = ""
animation-charging-2 = ""
animation-charging-3 = ""
animation-charging-4 = ""
animation-charging-font = 2
animation-charging-foreground = ${colors.cyan}
animation-charging-framerate = 750

; Blinking icon when battery is low (format-low uses <animation-low>).
animation-low-0 = "󰂎"
animation-low-1 = "󱃍"
animation-low-font = 2
animation-low-foreground = ${colors.red}
animation-low-framerate = 400

format-charging = <animation-charging> <label-charging>
format-discharging = <ramp-capacity> <label-discharging>
format-full = <ramp-capacity> <label-full>
format-low = <animation-low> <label-low>

[module/powermenu]
type = custom/text
format = ""
format-font = 2
format-foreground = ${colors.foreground}

click-left = ~/.config/polybar/scripts/powermenu.sh

[module/battery-alert]
type = custom/script
exec = ~/.config/polybar/scripts/battery-alert.sh
; Low-battery notifier. Needs an interval or polybar runs it only once at
; startup. Produces no visible output; it only sends the notification.
interval = 30

;----------------------------------------------------------
; Defined but not in any modules-* list. Left here so they are one word away
; from being re-enabled.
;----------------------------------------------------------

[module/memory]
type = internal/memory
interval = 2
label = "%percentage_used%%"
label-foreground = ${colors.orange}
ramp-used-0 = "󰍛"
ramp-used-font = 2
ramp-used-foreground = ${colors.orange}
format = %{A1:~/.config/polybar/scripts/btop-float.sh:}<ramp-used> <label>%{A}

[module/filesystem]
type = internal/fs
interval = 60
mount-0 = /
warn-percentage = 90
label-mounted = " %free%"
label-mounted-foreground = ${colors.white}
format-mounted-prefix = ""
format-mounted-prefix-font = 2
format-mounted-prefix-foreground = ${colors.magenta}
label-unmounted = "%{T2}%{T-} n/a"
label-unmounted-foreground = ${colors.dim}
format-mounted = <label-mounted>
format-unmounted = <label-unmounted>
click-left = alacritty -e duf

[module/systray]
; polybar 3.7 deprecated the bar-level tray-* keys in favour of this module.
; Disabled: add "systray" to modules-right on ONE bar to bring it back (the
; tray can only ever live on a single bar).
type = internal/tray
tray-background = ${colors.background}
tray-spacing = 8pt

[module/eth]
type = internal/network
interval = 5
interface-type = wired
label-connected = "%downspeed:2%  %upspeed:2%"
label-disconnected = "unlinked"
format-connected = <label-connected>
format-disconnected = <label-disconnected>

[module/xkeyboard]
type = internal/xkeyboard
blacklist-0 = num lock
label-layout = %layout%
label-layout-foreground = ${colors.cyan}

[settings]
screenchange-reload = true
; The bar background is an 80%-alpha tint (#cc...). picom composites it, so the
; bar is genuinely see-through. pseudo-transparency would sample the root pixmap
; instead and ignore the alpha channel entirely.
pseudo-transparency = false

; vim:ft=dosini
